# Kept although this package installs no console scripts (SIM-46), because a future one would
# otherwise land in bin/ and every `ros2 run` would fail with "libexec directory does not
# exist" while colcon reported success. That cost a bring-up during SIM-45.
[develop]
script_dir=$base/lib/webui
[install]
install_scripts=$base/lib/webui
