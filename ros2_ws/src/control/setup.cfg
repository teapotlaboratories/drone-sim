[develop]
script_dir=$base/lib/control
[install]
install_scripts=$base/lib/control

# Without testpaths, `colcon test` discovers nothing and reports "NO TESTS RAN" while
# exiting non-zero — a green-looking build with zero coverage. Plain
# `pytest test/test_frames.py` from this directory always worked, which is exactly what
# makes the gap easy to miss.
[tool:pytest]
testpaths = test
