# SIM-27 instrumentation fixture -- takeoff, hold, land. No translation.
#
# A copy of citysample-updown-30m.yaml with the 10 m north-and-back removed, under a tag of its
# own so its artifacts cannot overwrite a scenario anyone reports from (see SIM-41 -- re-flying a
# tag is what destroyed the 2026-08-27 evidence this ticket was built on).
#
# The REAL verification still flies citysample-gate1: a fix has to work in the world people
# actually fly, pedestrians and all. This one exists to make the probe cycle short.

# City Sample: takeoff to 30 m, forward 10 m, back 10 m, land.
#
# The FIRST scenario written for a world other than Blocks, and the reason SIM-36 exists: a
# scenario's waypoints are chosen FOR its world, and they are ENU relative to HOME, so a mission
# written for an empty box is geometrically valid over a city street and means nothing there.
# `square-10m.yaml` flown here landed a drone on a pavement among pedestrians and traffic.
#
# DELIBERATELY MINIMAL. This is the first flight in this world, so it does the least that still
# exercises takeoff, translation, return and landing. Widen it only once this passes.
name: citysample-probe
description: >-
  Take off to 30 m over City Sample, translate 10 m north, return, and land at the takeoff point.
  The smallest mission that still exercises the full flight path in a streaming world.

# ${DRONE_SIM_WORLDS} rather than an absolute path: a user's world is not part of the repo and
# lives wherever that machine keeps it. Hard-coding this checkout's location would make the
# scenario unusable elsewhere -- and worse, an operator whose CitySample sits somewhere else would
# have to pass --force-world, which records a "forced world mismatch" in the run's provenance for
# what is actually the correct world.
#
# On this machine:
#   export DRONE_SIM_WORLDS=/var/mnt/11d5da46-aef5-4b40-a085-40c23f52cc30/Developments/projects/drone-sim/worlds
#
# Unset it and the path resolves to a file that does not exist, and the runner says so with the
# resolved path. That is the intended failure: readable, not a silent fallback.
world: ${DRONE_SIM_WORLDS}/CitySample/CitySample.uproject

mission:
  # 30 m as asked. Higher than the Blocks scenarios' 20 m, which matters here: City Sample has
  # real buildings, and clearing them is the whole reason to go up before translating.
  takeoff_altitude_m: 30.0
  # ENU RELATIVE TO HOME (docs/conventions.md §3): +X east, +Y north, +Z up. NOT body-frame, so
  # "forward" has to be an axis rather than "where the nose points" -- the seed jitters spawn yaw,
  # and a body-frame reading would send each seed somewhere different. North is the choice.
  #
  # UNVERIFIED ASSUMPTION, and the first thing to check if this fails: that 10 m north of spawn
  # at 30 m altitude is clear. The spawn sits on a street; a building face within 10 m would put
  # the aircraft into it. If that happens the fix is a different bearing, not a lower altitude.
  # NO TRANSLATION AT ALL -- one waypoint, directly above HOME.                 (SIM-27)
  #
  # This is an INSTRUMENTATION fixture, not a mission. It exists to reach the landing as cheaply
  # as possible while the ground-lock probes are iterated: every second of horizontal flight is
  # time spent not measuring the thing under investigation, and on this world it is also exposure
  # -- `citysample-gate1` seed 3 took 187 contacts from BP_CrowdCharacter_C_6 during its descent,
  # which scored the run as a collision FAILURE and hid the pose split underneath it.
  #
  # It does NOT make the aircraft safe from pedestrians: the spawn is a city pavement and a crowd
  # character can still walk under a stationary hover. It removes the travel, not the street.
  #
  # One waypoint rather than none: an empty list makes offboard_control fly its built-in square,
  # which is the opposite of what this fixture is for.
  waypoints_enu:
    - [0.0, 0.0, 30.0]     # straight up, hold, come back down
  # The last waypoint is directly above HOME, so the landing happens where the vehicle took off --
  # on this world that is a pavement, which is exactly why the mission returns rather than landing
  # wherever it ended up. `SIM-35` was parked into `SIM-36` on this reasoning.

record_topics:
  - /fmu/out/vehicle_local_position
  - /fmu/out/vehicle_status_v1
  # SIM-27: the one topic that says why PX4 does not consider itself landed. On this world that
  # is not hypothetical -- the 10-seed gate on 2026-08-17 saw a non-terminating landing on 9 of
  # 10 seeds, with the actor frozen on the ground while the physics body kept descending.
  - /fmu/out/vehicle_land_detected
  - /mission/status
  - /mission/result

tolerances:
  accept_radius_m: 1.0
  hold_seconds: 2.0
  # 180 s, not the Blocks scenarios' 60. This is a PER-STATE flight budget handed to
  # offboard_control, NOT a bring-up allowance -- bring-up has its own 1200 s cap in
  # restart_stack, and describing this key as covering it would be wrong.
  #
  # What 180 actually buys, and costs: the harness cap becomes 180*7 + 120 = 1380 s per seed, and
  # a 180 s LAND state under the known SIM-27 non-terminating landing is what let the pose split
  # reach 107 m on seed 1 rather than the ~28 m the 60 s scenarios produce. That is a longer wait
  # for the same failure, and it is deliberate: this world streams during flight, and a budget cut
  # for an empty box would fail it for being slow rather than for flying badly.
  state_timeout_s: 180.0

seeded:
  # Same jitter as the Blocks scenarios. A seed moves the SPAWN POSE and nothing else, so ten
  # seeded runs here are ten repeats from slightly different points on the same street -- worth
  # running for flakiness, never describable as varied conditions.
  spawn_xy_jitter_m: 5.0
  spawn_yaw_jitter_rad: 3.14159
