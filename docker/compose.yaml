# Lane A stack — `docker compose up`
#
#   docker compose -f docker/compose.yaml up -d          # bring the stack up
#   docker compose -f docker/compose.yaml --profile test run --rm verify
#   docker compose -f docker/compose.yaml down -v
#
# WHY THE SERVICES SHARE ONE NETWORK NAMESPACE
# --------------------------------------------
# PX4 dials the uXRCE-DDS agent at *127.0.0.1*:8888, and Gazebo transport is pinned to
# loopback (GZ_IP=127.0.0.1) because Gazebo multicast flooding the host network is a
# documented cause of the Accel/Mag TIMEOUT failures (PX4/PX4-Autopilot#24595).
# Putting these services on a normal bridge network would break BOTH: PX4 would dial a
# loopback that no agent is listening on, and Gazebo discovery would leak.
# `network_mode: "service:px4-sitl"` puts every service in px4-sitl's netns, so 127.0.0.1
# means the same thing to all of them — exactly as in the single-container smoke test.
# Consequence: only px4-sitl may declare `ports:`; the others inherit them.

x-lane-a: &lane-a
  image: drone-sim/lane-a:v1.16.0
  restart: "no"
  # NOTE: shm_size is deliberately NOT here. Only px4-sitl needs it — the other services
  # join its IPC namespace and therefore use ITS /dev/shm, so declaring shm_size on them
  # is inert and misleading.

services:

  # ---------------------------------------------------------------------------------
  # PX4 SITL + Gazebo. Owns the network namespace the rest of the stack joins.
  # ---------------------------------------------------------------------------------
  px4-sitl:
    <<: *lane-a
    container_name: lane-a-px4
    hostname: px4-sitl
    # Docker defaults /dev/shm to 64 MB. Fast-DDS uses shared memory as its default
    # transport and starves at that size — measured, not theoretical. Every other service
    # shares this one via `ipc: service:px4-sitl`.
    shm_size: 2gb
    # The DONOR of an IPC namespace must opt in, or joiners fail with
    # "non-shareable IPC (hint: use IpcMode:shareable for the donor container)".
    ipc: shareable
    # Bound to LOOPBACK by default. Publishing on 0.0.0.0 would expose MAVLink GCS (14550),
    # offboard control (14540) and the XRCE agent (8888) to the LAN — i.e. anyone routable
    # could arm and command the vehicle. That matters doubly because this file is the
    # template for the Phase 4 hardware bring-up, where the same mistake reaches a Pixhawk.
    # For a remote QGC, set BIND_ADDR explicitly and understand what you are exposing:
    #   BIND_ADDR=0.0.0.0 docker compose -f docker/compose.yaml up -d
    ports:
      # BOTH GCS ports are published, and the handshake explains why:
      #   * PX4 binds 18570 (px4-rc.mavlink:11, udp_gcs_port_local=$((18570+instance)))
      #     and has no preconfigured remote.
      #   * QGC binds 14550 and auto-discovers by sending TO 18570.
      #   * PX4 then learns QGC's address and replies to 14550.
      # So 14550 is silent until a GCS speaks first — which is exactly why a heartbeat
      # aimed at 14550 on a fresh stack is discarded with no error and no log line.
      # Verified 2026-07-30 by decoding /proc/net/udp in both containers.
      - "${BIND_ADDR:-127.0.0.1}:18570:18570/udp"   # GCS datalink (PX4's actual GCS port)
      - "${BIND_ADDR:-127.0.0.1}:14550:14550/udp"   # conventional GCS listen port
      - "${BIND_ADDR:-127.0.0.1}:14540:14540/udp"   # offboard + programmatic control
      - "${BIND_ADDR:-127.0.0.1}:8888:8888/udp"     # uXRCE-DDS agent
      - "${BIND_ADDR:-127.0.0.1}:4560:4560/tcp"     # Gazebo <-> PX4
    environment:
      HEADLESS: "1"
      GZ_IP: "127.0.0.1"
    volumes:
      - ./ros-env.sh:/etc/profile.d/10-ros.sh:ro
      - ../out:/out
      - ../scenarios:/scenarios:ro
      - rosbags:/rosbags
    # A killed run leaves orphaned fastrtps_* segments behind; sweep before starting so a
    # cancelled job cannot poison the next one.
    # `stty min 1` is MANDATORY: PX4's pxh shell clears ICANON without setting VMIN, so with
    # a non-blocking stdin it busy-spins its prompt — ~1.45M writes/s, 4.1 GB per 300 s run
    # and a fully consumed CPU core.
    command:
      - bash
      - -lc
      - |
        rm -f /dev/shm/fastrtps_* 2>/dev/null || true
        mkdir -p /out && : > /out/px4.log
        screen -dmS px4sitl -L -Logfile /out/px4.log \
          bash -c "stty min 1 time 0; cd /opt/px4 && make px4_sitl gz_x500"
        echo "px4-sitl: launched under screen (attach with: docker compose exec px4-sitl screen -r px4sitl)"
        exec tail -f /out/px4.log
    healthcheck:
      test: ["CMD-SHELL", "grep -qa 'Startup script returned successfully' /out/px4.log"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s

  # ---------------------------------------------------------------------------------
  # uXRCE-DDS agent — the PX4 <-> ROS 2 bridge. Must share px4-sitl's loopback.
  # ---------------------------------------------------------------------------------
  xrce-agent:
    <<: *lane-a
    container_name: lane-a-xrce
    network_mode: "service:px4-sitl"
    # Sharing the netns is NOT enough. Fast-DDS discovers over UDP but delivers over SHARED
    # MEMORY, and each container gets its own /dev/shm — so topics appear in `ros2 topic
    # list` while `ros2 topic echo` returns nothing. Sharing the IPC namespace shares
    # /dev/shm and makes data actually flow. Verified 2026-07-29.
    ipc: "service:px4-sitl"
    depends_on:
      px4-sitl:
        condition: service_started
    volumes:
      - ./ros-env.sh:/etc/profile.d/10-ros.sh:ro
    command: ["MicroXRCEAgent", "udp4", "-p", "8888"]
    # The agent is the ENTIRE PX4<->ROS 2 bridge and it has crashed in this project's
    # history (v2.4.2 segfaulted creating DDS entities). Without a restart policy a crash
    # silently stops the topics while every other container still reports healthy.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[M]icroXRCEAgent' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------------
  # QGroundControl — the stack's ONLY MAVLink-over-IP client.
  #
  # ARCHITECTURE RULE: QGC speaks MAVLink over IP; everything else speaks ROS 2 over
  # uXRCE-DDS. On the real aircraft the only MAVLink link is the telemetry radio to a
  # ground station, and every other consumer sits on the ROS graph — so the sim matches.
  #
  # This is a FUNCTIONAL DEPENDENCY OF FLIGHT, not a viewer. PX4 refuses to arm without a
  # GCS datalink (NAV_DLL_ACT=2, set by the airframe at 4001_gz_x500:51), and that check is
  # deliberately left ENFORCED — it is the link an operator uses to take over. Stop this
  # service and arming is denied, verified both directions.
  #
  # QGC auto-discovers the vehicle; no manual UDP link configuration is needed.
  # ---------------------------------------------------------------------------------
  qgc:
    image: drone-sim/qgc:v1.16.0
    restart: unless-stopped
    container_name: lane-a-qgc
    network_mode: "service:px4-sitl"
    ipc: "service:px4-sitl"
    depends_on:
      px4-sitl:
        condition: service_started
    volumes:
      # QGroundControl is 180 MB and is NOT baked into the image. Fetch it with
      # ./scripts/fetch-qgc.sh — see the README.
      - ../vendor/tools/QGroundControl.AppImage:/qgc.AppImage:ro
      # This service OWNS the virtual display. Sharing the X socket lets the `recording`
      # service (D-02c) draw its panes on the SAME display and capture QGC's window,
      # instead of starting a second QGC that would fight over PX4's learned remote
      # address. It is also the attachment point for D-02b's live viewer.
      - xsock:/tmp/.X11-unix
    # HONEST LIMITATION: this proves QGC is RUNNING, not that the datalink is UP. QGC
    # emits no connection marker at default verbosity and uses unconnected UDP sockets, so
    # neither its log nor /proc/net/udp can witness the link from inside this container.
    # The link came up within ~10 s in testing, well inside the controller's 60 s arming
    # timeout, so the residual race is small — but it is a race, and a flight that fails at
    # `arm` right after a cold start is the symptom. Checking PX4's own
    # /fmu/out/failsafe_flags would be the real test; it belongs on the flight path, not in
    # a 10 s healthcheck loop.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[Q]GroundControl' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      # QGC takes ~15 s to come up under software GL, and longer to establish the link.
      start_period: 45s

  # ---------------------------------------------------------------------------------
  # ROS 2 side. Idles so you can exec into it; this is where ros2_ws nodes will run.
  # ---------------------------------------------------------------------------------
  ros2:
    <<: *lane-a
    container_name: lane-a-ros2
    network_mode: "service:px4-sitl"
    ipc: "service:px4-sitl"          # shared /dev/shm — see xrce-agent
    depends_on:
      px4-sitl:
        condition: service_healthy
    volumes:
      - ./ros-env.sh:/etc/profile.d/10-ros.sh:ro
      - ../out:/out
      - ../ros2_ws:/ros2_ws_src:ro
      - rosbags:/rosbags
    command:
      - bash
      - -lc
      - |
        # Build the workspace from the mounted source on every start. The build lives in
        # the container filesystem, so `compose down` discards it — without this it has to
        # be rebuilt by hand before every run, which is exactly the undocumented manual
        # step the reproducibility goal exists to remove.
        mkdir -p /ros2_ws/src && rm -rf /ros2_ws/src/control
        cp -r /ros2_ws_src/src/control /ros2_ws/src/control 2>/dev/null || true
        if [ -d /ros2_ws/src/control ]; then
          (cd /ros2_ws && colcon build --packages-select control --symlink-install) \
            && echo "ros2: control package built" || echo "ros2: WARNING - control build failed"
        fi
        echo "ros2: ready — try  docker compose exec ros2 bash -lc 'ros2 topic list'"
        exec sleep infinity

  # ---------------------------------------------------------------------------------
  # Acceptance gate. `--profile test` so it does not run as part of `up`.
  # Attaches to the RUNNING stack instead of starting its own PX4, so it verifies the
  # compose deployment rather than a private copy of it.
  # ---------------------------------------------------------------------------------
  verify:
    <<: *lane-a
    # No container_name: `compose run` ignores it and generates its own name.
    profiles: ["test"]
    network_mode: "service:px4-sitl"
    ipc: "service:px4-sitl"          # shared /dev/shm — see xrce-agent
    depends_on:
      px4-sitl:
        condition: service_healthy
      # Without this the gate can start before the bridge is up, see zero topics, and fail
      # spuriously. It passed only because PX4's healthcheck happens to take longer.
      xrce-agent:
        condition: service_healthy
      # NOT qgc. This gate tests the STACK — topics, rates, RTF, TIMEOUTs — and never
      # arms, so it does not need a datalink. Depending on qgc here made a 180 MB manual
      # download a hard prerequisite for the D-01/D-02 acceptance gate, which failed with
      # "dependency failed to start: container lane-a-qgc is unhealthy". A FLIGHT test
      # does need qgc; that belongs in P1-06, where the dependency is real.
    environment:
      SMOKE_ATTACH: "1"          # do not launch PX4/agent; the stack is already up
      DURATION: "${DURATION:-300}"
      OUTDIR: /out
    volumes:
      - ./ros-env.sh:/etc/profile.d/10-ros.sh:ro
      - ../out:/out
      - ../tests/lane-a-smoke.sh:/smoke.sh:ro
    command: ["bash", "/smoke.sh"]

  # ---------------------------------------------------------------------------------
  # Recording (D-02c) — records the RUNNING stack, under `--profile record`.
  #
  # It ATTACHES rather than starting its own PX4/Gazebo/agent: it runs only the Gazebo GUI
  # client against px4-sitl's server, tails the real PX4 console, places the qgc service's
  # own window, and flies with the same ROS 2 node the acceptance gate uses. The old
  # recorder started a private stack that merely resembled the one under test.
  #
  # Uses the demo image because ffmpeg/xterm/xdotool are recording concerns, not core ones.
  # ---------------------------------------------------------------------------------
  recording:
    image: drone-sim/lane-a-video:v1.16.0
    profiles: ["record"]
    container_name: lane-a-recording
    network_mode: "service:px4-sitl"
    ipc: "service:px4-sitl"
    depends_on:
      px4-sitl:
        condition: service_healthy
      # The display and the QGC window both belong to this service.
      qgc:
        condition: service_healthy
    environment:
      DISPLAY: ":99"
      OUTDIR: /out
      RES: "${RES:-1920x1080}"
      ALT: "${ALT:-10}"
    volumes:
      - ./ros-env.sh:/etc/profile.d/10-ros.sh:ro
      - ../out:/out
      - ../ros2_ws:/ros2_ws_src:ro
      - ./demo/record-attached.sh:/record.sh:ro
      - xsock:/tmp/.X11-unix
    command: ["bash", "/record.sh"]

volumes:
  rosbags:
  # Shared X socket: qgc owns the display, recording draws on it. See both services.
  xsock:
