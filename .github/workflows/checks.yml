# Fast checks that run on a GitHub-hosted runner (P1-07, tier 1).
#
# WHAT THIS DELIBERATELY DOES NOT DO: run the SITL flight gate.
#
# That is not an oversight, it is arithmetic. A hosted runner gives 2 vCPU, 7 GB RAM and
# about 14 GB of free disk. The Lane A image is 11.6 GB and takes 20-40 minutes to build,
# so it neither fits comfortably nor builds inside the 10-minute budget the plan sets. And
# the gate asserts an aggregate real-time factor of 0.95 or better — on 2 vCPU, PX4 and
# Gazebo would miss that on the hardware, not on the code, turning a physics gate into a
# runner-capacity gate.
#
# So this job protects everything that can be checked WITHOUT a simulator, in about a
# minute, on every push. The flight gate needs a self-hosted runner and is tier 2 —
# see P1-07 in docs/lane-a/todo.md. Until that exists, `scripts/run_gate.py` is run by
# hand and CI does not pretend otherwise.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# The repository default for GITHUB_TOKEN is WRITE. This job runs pytest and grep — it
# needs to read the checkout and nothing else. Set explicitly rather than inherited,
# because this file is the template tier 2 and D-05 will be copied from.
permissions:
  contents: read

# Supersede an in-flight run when the same ref is pushed again.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  off-target-tests:
    runs-on: ubuntu-latest
    # A 24-second job inherits a 6-HOUR default timeout. The `git ls-files | xargs grep`
    # pattern can read stdin and hang if the file list is ever empty.
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag. `v4` is a moving ref, and this project's own
      # rule is that a branch is not a pin — learned when the XRCE agent's branch pin
      # evaporated and again when QGC's `latest` channel had to be repinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'   # matches ROS 2 Jazzy, per versions.lock

      - name: Install test dependencies
        # PyYAML only: the suite deliberately has no simulator, ROS or container
        # dependency, which is what lets it run here at all.
        run: pip install --quiet pytest pyyaml

      - name: Off-target tests
        run: python3 -m pytest tests/ -v

      - name: Shell scripts parse
        # Catches the class of error that has actually bitten this repo — an unbalanced
        # quote or a stray delimiter in a script nobody runs until a flight depends on it.
        run: |
          fail=0
          # -z / read -d: filenames with spaces would otherwise split into fragments and
          # silently check the wrong paths.
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(git ls-files -z '*.sh')
          exit $fail

      - name: Python scripts parse
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::py_compile failed"; fail=1; }
          done < <(git ls-files -z '*.py')
          exit $fail

      - name: Compose file is valid
        # `compose config` resolves interpolation, which is how the inert FOLLOW_* knobs
        # were caught before they shipped.
        run: docker compose -f docker/compose.yaml config --quiet

      - name: .repos agrees with versions.lock
        # .repos says it itself: versions.lock is the authority, .repos is the mechanism.
        # On 2026-07-31 they disagreed in two places, and one reconstructed a BROKEN tree —
        # the XRCE agent pinned at v2.4.2, which versions.lock records as genuinely
        # unbuildable because upstream deleted the Fast-DDS branch its superbuild needs.
        # `vcs import vendor < .repos` on a fresh machine would have checked out the
        # version that cannot compile.
        run: python3 scripts/check_repos_manifest.py

      - name: Every worklog has an HTML render and an index card
        # .ai/AGENTS.md requires one render per worklog plus a card in the index. The rule
        # has been missed twice — once found by a CI audit, and again on 2026-07-31 when
        # two same-day worklogs shipped unrendered. Both times it was invisible until
        # someone went looking, which is exactly what a check is for.
        #
        # Shared with scripts/run_local_ci.sh rather than duplicated here, so a local pass
        # and a CI pass mean the same thing.
        run: python3 scripts/check_worklog_renders.py

      - name: No AI attribution
        # The project rule is that everything reads as the owner's work — enforced rather
        # than remembered.
        #
        # Three files are excluded because they DEFINE the rule and necessarily quote the
        # forbidden strings in order to forbid them: the two rule documents, and THIS
        # WORKFLOW, which contains the very pattern it searches for.
        #
        # That last one was found by CI, not locally — and the reason is worth keeping.
        # `git ls-files` lists TRACKED files only, so while the workflow was still
        # untracked the check could not see itself and passed. It failed on the first push,
        # once the file was committed. Running a workflow's steps locally is worth doing,
        # but it does not reproduce what `git ls-files` returns after `git add`.
        run: |
          hits=$(git ls-files \
                 | grep -vE '^(\.ai/AGENTS\.md|CLAUDE\.md|\.github/workflows/checks\.yml)$' \
                 | xargs grep -lniE 'co-authored-by:.*claude|generated with .*claude|🤖' 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::AI attribution found in: $hits"
            exit 1
          fi

      - name: Every versions.lock CONFLICT is documented
        # NOT "there are no conflicts". There is a real, accepted one — the NVIDIA driver
        # against Isaac Sim's validated version, which is why Lane B is deferred. Failing
        # on a known, deliberate state would make this job noise, and a CI job people learn
        # to ignore is worse than none.
        #
        # What is worth enforcing is that a CONFLICT never sits there unexplained.
        run: |
          python3 - <<'EOF'
          import re, sys
          text = open("versions.lock").read()
          # Entries look like:  status: CONFLICT  followed by a summary: within the block.
          bad = []
          for m in re.finditer(r"^(\s*)status:\s*CONFLICT\s*$", text, re.M):
              tail = text[m.end():m.end() + 800]
              if "summary:" not in tail.split("\n\n")[0]:
                  bad.append(text[:m.start()].count("\n") + 1)
          if bad:
              print(f"::error file=versions.lock::CONFLICT without a summary at line(s) {bad}")
              sys.exit(1)
          print("all CONFLICT entries carry a summary")
          EOF
