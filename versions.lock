# versions.lock — pinned toolchain for drone-sim
#
# Version coupling IS the architecture, not a detail (.ai/AGENTS.md:281). Two PX4 trees,
# two Python runtimes, one branch-matched message set. Resolve every entry here BEFORE
# writing code, and let CI assert the couplings in the `couplings:` block below.
#
# Drafted 2026-07-28 during Phase 0 scaffolding. NOTHING here has been installed yet —
# this is the target lock, not a record of a working system.
#
# status vocabulary
#   observed     — measured on this machine on the date given; trustworthy
#   pinned       — version fixed by the design docs in docs/reference/; not yet installed
#   TODO-verify  — unknown or unconfirmed; MUST be resolved before Phase 0 exit
#   CONFLICT     — a known contradiction between two pins; needs a decision, not a guess
#
# Rule: an entry is not "locked" until it has a version AND (where applicable) a SHA AND
# a passing smoke test. `sha: TODO-verify` means the pin is nominal, not reproducible.

meta:
  drafted: 2026-07-28
  phase: 0
  drafted_by_running: docs/phase-0/todo.md
  note: >-
    Every sha/tag below marked TODO-verify must be filled from an actual checkout, not
    from documentation. Pin the SHA that was built and smoke-tested, not the branch tip.

