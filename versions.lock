# ---------------------------------------------------------------------------
# Couplings CI must assert — these are the failure modes that are SILENT
# ---------------------------------------------------------------------------
couplings:
  - id: px4-msgs-branch-match
    assert: px4_msgs branch == release/1.16 AND /fmu/out/* topics actually populate
    why: A mismatch does not error; it silently produces empty topics.
    severity: high
  - id: two-px4-trees
    assert: lane_a PX4 == v1.16.0 AND lane_b PX4 == v1.14.3, as separate checkouts
    why: Pegasus v5.1.0 was tested against v1.14.3; Lane A and real hardware need v1.16.x.
    severity: high
    status_2026_07_31: >-
      IN QUESTION, and that is good news. Lane B is deferred, so its v1.14.3 tree is not
      currently built. If C-03 shows Cosys-AirSim drives PX4 v1.16.0 over the MAVLink SITL
      API, the project runs ONE tree and this coupling collapses to a single assertion.
      Do NOT delete the v1.14.3 pin on that basis — it belongs to Pegasus, and Lane B
      reopens unchanged if the host is rebased to an R580 driver.
  - id: python-split
    assert: Isaac Sim runs Python 3.11; application ROS 2 nodes run Python 3.12; rclpy never shared
    why: C-extension ABI mismatch -> ModuleNotFoundError rclpy._rclpy_pybind11.
    severity: high
  - id: pegasus-isaac-pair
    assert: Pegasus v5.1.0 pairs with Isaac Sim 5.1.0 exactly
    why: Explicitly not backward-compatible across releases.
    severity: high
  - id: isaac-driver
    assert: the installed NVIDIA driver actually launches Isaac Sim (empirical, not version-compare)
    why: Isaac breaks on drivers both too old AND too new; 610.43.03 is unvalidated.
    severity: blocker-for-lane-b
  - id: cesium-physx-exclusive
    assert: no OMNIVERSE scene enables Cesium/FSD and PhysX simultaneously
    why: Mutually exclusive; physics is silently disabled.
    severity: medium
    scope_correction_2026_07_31: >-
      This is an ISAAC/OMNIVERSE coupling (Cesium for Omniverse + Fabric Scene Delegate).
      It was previously written as if it also bound Lane C. Cesium for UNREAL is a
      different plugin and this exclusion does not automatically transfer — treat the UE5
      case as UNVERIFIED rather than as either broken or fine.
  - id: single-ros2-distro
    assert: every image, package and wrapper in the project builds against ROS 2 JAZZY
    why: >-
      Decided 2026-07-31 against 04_ue5_stack_architecture.md's Humble recommendation.
      A second distro is not a small addition — it forks the base image, the px4_msgs
      branch match, the perception packages and CI. The one sanctioned exception is the
      documented lane_c.ros2_distro_fallback sidecar, and using it requires recording the
      build failure that justified it.
    severity: high
  - id: lane-c-sha-not-branch
    assert: cosys_airsim is pinned by SHA, never by branch or tag-following-branch
    why: >-
      This project has already been burned twice by branch pins — eProsima deleted the
      Fast-DDS branch the XRCE agent's v2.4.2 tag depended on, making a tagged release
      retroactively unbuildable, and QGC's `latest` channel had to be repinned to an exact
      release + sha256. Cosys-AirSim's UE5.5 support was a pre-release branch, which is
      exactly the shape that evaporates.
    severity: high
  - id: airsim-rpc-port-conflict
    assert: >-
      whatever answers on the AirSim RPC port is actually Cosys-AirSim — check the reported
      server version, do not trust "Connected!"
    why: >-
      Found the hard way 2026-08-01 (C-06). A CARLA UE4 instance runs on this host bound to
      0.0.0.0:41451, the exact port Cosys-AirSim uses. The ROS 2 wrapper connected to it,
      negotiated a handshake, reported "API Server Ver:1 (Min Req:4)" and failed — but the
      log line before that said "Connected!", which is exactly what a working setup looks
      like at a glance. A silent cross-connection to the wrong simulator is a debugging
      nightmare, and it is also bound to 0.0.0.0 rather than loopback, which is the same
      exposure class D-02 fixed for the MAVLink ports.
    severity: medium
  - id: lane-c-topic-parity
    assert: >-
      Lane C's /fmu/out/* topic names are IDENTICAL to Lane A's, produced by PX4's own
      uxrce_dds_client — verified by diffing `ros2 topic list`, not by inspection
    why: >-
      The sim-to-real claim is "only the transport is swapped". If Lane C's autonomy code
      subscribes to /airsim/* poses instead of /fmu/out/*, the code that flies in sim is
      not the code that flies on the Pixhawk 6C, and the divergence will not surface until
      Phase 4. AirSim's MAVLink lockstep and PX4's XRCE-DDS client coexist by design:
      MAVLink drives sim physics, XRCE-DDS drives autonomy.
    severity: high
  - id: rtf-floor
    assert: SITL real-time factor stays above the floor for the whole run
    why: Retries alone turn lockstep desync into an intermittent green build.
    severity: high
    measured_floor: 1.000
    measured_on: 2026-07-28, P0-07, 15 samples over 300 s, min=mean=max=1.000
    proposed_ci_floor: 0.95
    assert_on: AGGREGATE RTF = (sim_time advanced)/(real_time advanced) over the whole run
    do_not_assert_on: the instantaneous real_time_factor field, and NEVER its minimum
    note: >-
      CORRECTED 2026-07-29. The original 0.95-on-minimum rule was written against SPARSE
      sampling (1 reading / 20 s). With dense sampling (~9.5 Hz, ~2930 samples per 300 s
      run) a healthy NATIVE run produced a single transient at 0.503 out of 2931 samples —
      which a min-based gate would fail. Assert on a percentile (e.g. p99 >= 0.95) or on N
      consecutive sub-threshold samples, so isolated scheduler jitter does not flap CI
      while a genuine sustained stall still trips it. Container runs show exactly such a
      sustained stall: dozens of consecutive samples at 0.25-0.35 over 5+ seconds.
      CORRECTED AGAIN 2026-07-29: those "sustained stalls" were an artifact of the
      INSTANTANEOUS real_time_factor field, which is a short-window estimate swinging
      0.14-1.01 while the true ratio was 0.977. Both sim_time and real_time are published in
      the same message; their ratio over the run is the honest metric. Cross-check: the
      /fmu/out publish rate tracks the AGGREGATE ratio (97.2 Hz = 97.7% of 100 Hz), not the
      instantaneous minimum. Measured aggregates: native 1.0000, host podman 0.9967,
      nested Docker 0.9767.
      Do NOT let a retry alone turn a desync into a green build.

# ---------------------------------------------------------------------------------------
# Container images built by this repo.
#
# Recorded because FLIGHT DEPENDS ON THEM, not for completeness: PX4 refuses to arm without
# a GCS datalink, that check is deliberately left enforced, and the datalink is
# QGroundControl running in the `qgc` image. An unrecorded build recipe for the component
# that gates arming is the same reproducibility gap that the QGroundControl AppImage had
# until 2026-07-30.
#
# The image IDs are the LOCAL build on `carbonite` at the time of writing. They are
# evidence of what was tested, NOT a portable pin — a rebuild elsewhere from the same
# Dockerfile will produce a different ID. The Dockerfile plus the pins it asserts are the
# reproducible part; D-05 (CI builds the images) is what turns these into published digests.
# ---------------------------------------------------------------------------------------
images:
  lane_a:
    tag: drone-sim/lane-a:v1.16.0
    dockerfile: docker/lane-a.Dockerfile
    entrypoint: docker/lane-a-entrypoint.sh
    base: ubuntu:24.04
    local_image_id: sha256:f2b915c68b7b8a29ef43ebc0f4349ab56c97c574c413400a2d9707aee318be19
    size_approx: 11.6 GB
    role: the shippable Lane A stack — PX4, Gazebo, ROS 2, XRCE agent, px4_msgs
    asserts: every pin above is verified against its recorded SHA at build time
    status: LOCKED

  qgc:
    tag: drone-sim/qgc:v1.16.0
    dockerfile: docker/qgc.Dockerfile
    entrypoint: docker/qgc-entrypoint.sh
    base: drone-sim/lane-a:v1.16.0
    local_image_id: sha256:c615b2e6159e14753d8f952519f4c241031aef7292a8992b876e1b706b3475d4
    role: >-
      QGroundControl headless on Xvfb — the ONLY component permitted to speak MAVLink over
      IP, and the datalink PX4 requires before it will arm. Also owns the shared X display
      the `recording` service draws on.
    adds: xvfb, openbox, x11-utils, libfuse2t64, Qt xcb deps, fonts-dejavu-core, qgcuser
    note: >-
      QGroundControl IS baked in: downloaded from the pinned URL, sha256-verified, and
      extracted once at build time (452 MB extracted, against 180 MB compressed — the
      trade buys back per-start unpacking, which the gate pays ten times per run).
      A mismatch fails the build.
    status: LOCKED

  ros2:
    tag: drone-sim/ros2:v1.16.0
    dockerfile: docker/ros2.Dockerfile
    base: drone-sim/lane-a:v1.16.0
    adds: ros-jazzy-ros-gz-bridge (the /clock bridge, P1-03a)
    role: >-
      The ROS 2 / companion-computer image. SEPARATE FROM lane-a ON PURPOSE:
      ros-gz-bridge pulls gz_transport_vendor, whose libgz-transport13 shadows the system
      Harmonic library once ROS is sourced and BREAKS the gz CLI — which stopped px4-sitl
      from launching its own simulator. Whatever runs Gazebo stays on plain lane-a.
    do_not: add anything here that needs to launch `gz`
    status: LOCKED

  lane_a_video:
    tag: drone-sim/lane-a-video:v1.16.0
    dockerfile: docker/demo/lane-a-video.Dockerfile
    base: drone-sim/lane-a:v1.16.0
    local_image_id: sha256:ca4f4aa5198ebdfc8c17537240af0a262526531399ca09408e2cd6a9983029f2
    role: recording only — the `recording` service (D-02c). Not needed by CI or by flight.
    adds: ffmpeg, xterm, xdotool, openbox, imagemagick, mesa-utils
    status: observed
