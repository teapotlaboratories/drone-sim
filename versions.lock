  isaac_ros_workspace:
    repo: IsaacSim-ros_workspaces
    sha: TODO-verify
    status: TODO-verify
    note: >-
      Build jazzy_ws against PYTHON 3.11 via its Dockerfile/build_ros.sh. Isaac Sim
      launches from that sourced terminal; application nodes run from a separate system
      Jazzy (3.12) terminal. The two halves meet over DDS — rclpy is never shared.
    smoke: publish /clock from Isaac; `ros2 topic echo /clock` from the 3.12 terminal.
  pegasus:
    repo: https://github.com/PegasusSimulator/PegasusSimulator.git
    version: v5.1.0
    sha: TODO-verify
    status: pinned
    install: ISAACSIM_PYTHON -m pip install --editable pegasus.simulator
    note: >-
      Explicitly NOT backward-compatible: v5.1.0 pairs with Isaac Sim 5.1.0 only. Launch
      examples with `isaac_run`, not ISAACSIM_PYTHON (v5.1.0 changelog). Upstream tested
      on Ubuntu 22.04 + driver 550.163.01 + PX4 v1.14.3; we are on 24.04 + 610.43.03.

# ---------------------------------------------------------------------------
# Lane C — UE5.5 + Cosys-AirSim   *** THE PRIMARY STACK ***
#
# *** PROMOTED 2026-07-29 *** to photoreal-perception lane, replacing deferred Lane B.
# *** PRIMARY 2026-07-31 ***   the project's main simulator. PHASE 2 (perception +
# obstacle avoidance) IS BUILT HERE, NOT IN GAZEBO. Decision doc:
# docs/reference/04_ue5_stack_architecture.md. Backlog: docs/lane-c/todo.md
#
# Rationale, unchanged and now acted on: none of the three target papers (SPF, Fly0, OnFly)
# uses Isaac — all evaluate on Unreal/AirSim-family simulators — and this lane is
# driver-agnostic, so the Isaac blocker does not apply here.
#
# WHAT IS AND IS NOT BUILT HERE (corrected 2026-08-01 — this header previously said
# "NOTHING IN THIS SECTION IS BUILT YET", which the same branch then contradicted):
#   BUILT   cosys_airsim_ros2_wrapper — colcon build on Jazzy, exit 0, artifacts asserted
#           (C-06). This is the ROS 2 bridge ONLY.
#   NOT     everything else. No engine image pulled, no UE build, no simulator run, no
#           flight. The wrapper has never talked to a real Cosys-AirSim server.
# This lane is rated HIGH LIKELIHOOD / MED IMPACT for BUILD FRAGILITY, and being declared
# primary does not change that — it raises the cost of it. Pin a SHA, never a branch.
# ---------------------------------------------------------------------------
lane_c:
  lane_status: PRIMARY   # promoted 2026-07-29; made primary 2026-07-31
  first_build_not_yet_attempted: true   # flip this when C-02 produces an engine image

  decisions_2026_07_31:
    ros2_distro: >-
      JAZZY — a DELIBERATE DEVIATION from 04_ue5_stack_architecture.md, which recommends
      Humble. That recommendation is inherited from upstream AirSim/CARLA-Air example docs,
      not measured against Cosys-AirSim. Every pin this project has actually built and
      smoke-tested is Jazzy: Ubuntu 24.04 / Python 3.12.3, ros-jazzy-desktop, all four
      container images, px4_msgs release/1.16 branch-matched to PX4 v1.16.0, the
      ros-jazzy-ros-gz-bridge /clock bridge, and the Isaac ROS perception packages
      (cuVSLAM, nvblox) which are Jazzy-only. Moving to Humble means Ubuntu 22.04 and
      rewriting all of it to match a documentation preference. THE RISK IS REAL AND OWNED:
      if the Cosys-AirSim ROS 2 wrapper will not build on Jazzy/24.04, that is discovered
      in C-06 BEFORE any UE5 work is committed to. See ros2_distro_fallback below.
      STRENGTHENED THE SAME DAY BY RESEARCH: upstream's current docs name Jazzy and Ubuntu
      24.04 as the tested environment, and Humble can no longer compile the wrapper at all.
      The decision was taken on the reasoning that 04's Humble was inherited rather than
      measured; the evidence then showed 04's recommendation is simply out of date.
    lane_a_role: >-
      DEMOTED TO REGRESSION BASELINE, not retired — matching 04's own Fallback #2. Lane A
      keeps tier-1 CI, the P1-06 flight gate, and the ground truth Lane C is compared
      against. No new capability work lands there.
    phase_numbering: >-
      MAPPED, NOT RENUMBERED. 04's Phase 0-3 are calendar weeks; this project's Phase 0-4
      are capabilities with measured exit criteria, and the P<phase>-<nn> task-ID scheme is
      load-bearing (it exists so a task ref cannot mis-link as a GitHub #N). Mapping table:
      04_ue5_stack_architecture.md, "Decisions taken on this document".

  ros2:
    distro: jazzy          # SAME as lane_a — one distro across the whole project
    rationale: see decisions_2026_07_31.ros2_distro
    status: pinned         # pinned for Lane C; already `observed` in lane_a
  ros2_distro_fallback: >-
