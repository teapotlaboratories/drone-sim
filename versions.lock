      (July 2026) — CHANGELOG: "Fixed ROS2 header imports to support newer ROS2 distros
      such as Jazzy" (commit 83d1b81c, 2025-09-24, which rewrites cv_bridge and
      tf2_geometry_msgs includes from .h to .hpp) — and v3.4 targets UE5.8. The same
