lane_b:
  lane_status: DEFERRED   # see header above; not abandoned, fully reversible
  px4:
    repo: https://github.com/PX4/PX4-Autopilot.git
    tag: v1.14.3
    sha: TODO-verify
    status: pinned
    vendor_path: vendor/PX4-Autopilot-v1.14.3
    transport: MAVLink SITL API (TCP 4560), NOT uXRCE-DDS
    note: >-
      A SECOND, separate PX4 checkout. Pegasus v5.1.0 was developed and tested against
      v1.14.3 verbatim. This is designed around from day one, not worked around later.
  isaac_sim:
    version: 5.1.0
    python: "3.11"
    ngc_container_tag: nvcr.io/nvidia/isaac-sim:5.1.0   # RESOLVED: public, no NGC login needed
    local_image: DELETED 2026-07-30 to reclaim ~36 GB (Lane B deferred); re-pull is one command
