# ---------------------------------------------------------------------------
# GPUs — the work split is a hard rule (docs/reference/03_hardware_assessment.md:80)
# ---------------------------------------------------------------------------
gpu:
  driver:
    installed: "610.43.03"
    cuda_umd: "13.3"
    status: observed
    observed_on: 2026-07-28
  isaac_validated_driver:
    version: "580.65.06"
    status: pinned
    source: docs/reference/03_hardware_assessment.md:12
  driver_conflict:
    status: CONFLICT
    summary: >-
      Installed driver 610.43.03 is four branches newer than Isaac Sim 5.1's validated
      580.65.06. Isaac Sim has documented startup failures on drivers that are TOO NEW:
      isaac-sim/IsaacSim#537 (fails to detect CUDA device on 595.79, works on 580),
      isaac-sim/IsaacSim#229 (Warp CUDA error 'Failed to get driver entry point
      cuDeviceGetUuid' on 580.65.06 — "my driver is too new for this version of Isaac
      Sim"), and NVIDIA forum staff noting "report of invalidated driver past 580 on
      5.1.0".
    why_hard: >-
      The driver is injected from the ostree-immutable HOST (--nvidia), so it cannot be
      changed with apt inside the container. Downgrading means rebuilding/rebasing the
      host image, which needs host sudo (password not available to the agent).
    blast_radius: >-
      Lane B (Isaac Sim + Pegasus) and Phase 3 only. Lane A (PX4 + Gazebo, Phase 0-2) and
      the vLLM server do NOT depend on this and are unblocked.
    resolution: CONFIRMED BROKEN — Isaac Sim 5.1 does NOT run on driver 610.43.03
    tested: 2026-07-28 (P0-09)
    evidence: >-
      nvcr.io/nvidia/isaac-sim:5.1.0 (14.0 GB, public, no NGC login needed), headless
      SimulationApp probe, GPU 0 (RTX 3080) exposed alone via --device nvidia.com/gpu=0.
      Result: docker rc=139 (SIGSEGV). Crash signature `rtx.scenedb.plugin` x5 —
      "[Fatal] librtx.scenedb.plugin.so!carbOnPluginStartup", then "Segmentation fault
      (core dumped)". SimulationApp never came up: PROBE_APP_UP never printed.
      This is verbatim the failure 03_hardware_assessment.md:41 documents.
    key_disambiguation: >-
      The crash occurred on the AMPERE RTX 3080 with the Blackwell 5060 Ti excluded from
      the container entirely. So this is NOT the documented Blackwell/Isaac instability —
      it is purely the driver version. Swapping cards or reassigning roles cannot fix it.
    isaac_gpu_table: >-
      Isaac's own [gpu.foundation] enumeration did render before the crash and confirms
      the container boundary works as a GPU pin:
      "Driver Version: 610.43.03 | Graphics API: Vulkan | 0 | NVIDIA GeForce RTX 3080 |
      Yes: 0 | 10240 MB | UUID a59afb24..". Exposing one GPU via --device
      nvidia.com/gpu=0 makes it index 0 inside, which enforces render-on-the-3080 at the
      container boundary rather than relying on --/renderer/activeGpu.
    fallback_1_ngc_container: EXHAUSTED — the container bundles userspace but still uses the host KMD.
    next_action: >-
      (b) Test Isaac Sim 6.0.0 (nvcr.io/nvidia/isaac-sim:6.0.0, public) on 610.43.03. If
      6.0 runs, the trade becomes: 6.0 needs Python 3.12 (rewrites the P0-10 ROS 2
      integration path) and BREAKS Pegasus v5.1.0, which pins to Isaac 5.1.0 exactly — so
      Lane B would need a Pegasus alternative or a Pegasus version that targets 6.0.
      (c) Otherwise: host image rebase to an R580 driver. OWNER-ONLY — the driver comes
      from the ostree-immutable host, and the same host also serves ~1.1 TB of Steam
      libraries that may want a 610-era driver.
  devices:
    - index: 0
      name: NVIDIA GeForce RTX 3080
      arch: Ampere sm_86
      vram_mib: 10240
      role: RENDER — Isaac Sim, UE5, Isaac ROS perception, display
      status: observed
      note: >-
        Below Isaac Sim 5.1's stated 16 GB minimum. It runs, but cap scene complexity,
        RTX-sensor count and resolution. Pin with --/renderer/activeGpu=0
        --/physics/cudaDevice=0; the index comes from the Omniverse .log
        [gpu.foundation] table, NOT nvidia-smi ordering. CUDA_VISIBLE_DEVICES does not
        control the Vulkan RTX renderer.
    - index: 1
      name: NVIDIA GeForce RTX 5060 Ti
      arch: Blackwell sm_120
      vram_mib: 16311
      role: INFERENCE ONLY — vLLM / VLM serving
      status: observed
      note: >-
        Confirmed the 16 GB variant (16311 MiB), which resolves an open question in
        03_hardware_assessment.md:83 — Qwen3-VL-8B AWQ is viable locally with KV
        headroom, not just 2B/4B. Never render on this card. vLLM honours
        CUDA_VISIBLE_DEVICES=1.
  rules:
    - Never span a single Isaac Sim render across both dissimilar cards (documented corruption).
    - Never run UE5 shader compilation concurrently with a heavy Isaac Sim scene.

# ---------------------------------------------------------------------------
# Lane A — PX4 v1.16.x + Gazebo Harmonic + ROS 2 Jazzy
#          (Phase 0-1 · then ALWAYS-ON REGRESSION BASELINE · and REAL HARDWARE)
#
# *** DEMOTED 2026-07-31 *** — demoted, NOT retired. Lane C (UE5.5 + Cosys-AirSim) is now
# the primary stack and Phase 2 is built there, per docs/reference/04_ue5_stack_architecture.md.
# That report's own Fallback #2 keeps Gazebo as "the always-on PX4 sim-to-real ground-truth
# baseline", which is exactly this lane's new role.
#
# WHAT STAYS HERE, PERMANENTLY:
#   - tier-1 CI (.github/workflows/checks.yml) and the P1-06 flight gate (SR 10/10)
#   - the controls / sim-to-real ground truth every Lane C result is compared against
#   - REAL HARDWARE: the Pixhawk 6C runs this exact PX4 tree (v1.16.0). Unchanged.
# WHAT DOES NOT:
#   - new capability work. Phase 2 perception + obstacle avoidance moved to Lane C.
#
# WHY KEEP IT AT ALL: it is the only thing in this project that currently FLIES, and Lane C
# is rated High-likelihood for build fragility. A Lane C regression is measured against a
# Lane A run, not against a previous Lane C run.
# ---------------------------------------------------------------------------
lane_a:
  lane_status: REGRESSION BASELINE   # demoted 2026-07-31; always-on, frozen in scope
  px4:
    repo: https://github.com/PX4/PX4-Autopilot.git
    tag: v1.16.0
    sha: 6ea3539157ca358c70a515878b77077af7d4611d   # cloned + verified 2026-07-28
    submodules: 35, all initialized (recursive)
    disk: 2.6 GB
    status: LOCKED   # smoke-tested 2026-07-28 (P0-07)
    vendor_path: vendor/PX4-Autopilot-v1.16
    build: bash Tools/setup/ubuntu.sh && make px4_sitl gz_x500
    smoke: "make px4_sitl gz_x500 — do NOT append _default"
    smoke_result: >-
      P0-07, 300 s continuous headless: 0 Accel/Mag TIMEOUT, 0 ERROR lines, RTF
      1.000/1.000/1.000 over 15 samples, 24 /fmu/out/* topics at 100.02 Hz
      (std dev 0.002 s), px4+gz+agent all alive at end.
    launch_env: "HEADLESS=1 GZ_IP=127.0.0.1"
    launch_requirement: >-
      MUST be launched with a BLOCKING stdin, e.g. under screen with `stty min 1 time 0`.
      PX4's pxh shell (platforms/posix/src/px4/common/px4_daemon/pxh.cpp) clears ICANON
      without setting c_cc[VMIN], which POSIX requires. With a pipe (EOF) or screen's pty
      (VMIN=0) getchar() returns instantly and the prompt loop busy-spins, emitting
      "pxh> " + ESC[2K + CR ~1.45 MILLION times/second: 4.1 GB per 300 s run and one CPU
      core consumed. This filled a 32 GB tmpfs, destroyed RTF measurements mid-run, broke
      tooling, and caused sensor TIMEOUTs via I/O saturation. With `stty min 1`: ~28 KB per
      300 s. Upstream defect; report it. Recommended launcher:
      screen -dmS px4sitl -L -Logfile <log> bash -c "stty min 1 time 0; make px4_sitl gz_x500"
      (also gives an attachable, interactive console: screen -r px4sitl)
    note: >-
      This tree also serves REAL hardware (Pixhawk 6C). v1.16 introduced uORB message
      versioning and a required ROS 2 Message Translation Node.
  ros2:
    distro: jazzy
    package: ros-jazzy-desktop + ros-dev-tools
    desktop_version: 0.11.0-1noble.20260616.084553   # installed + verified 2026-07-28
    ros_base_version: 0.11.0-1noble.20260616.084325
    apt_source: ros2-apt-source 1.2.0~noble
    python: "3.12.3"
    status: observed
    smoke: "ros2 topic list -> /parameter_events /rosout; import rclpy on 3.12.3 — both PASS"
    note: >-
      The old apt-key method was retired 2025-06-01 — the ros2-apt-source .deb release is
      what works. Pin the DESKTOP VERSION, not just "jazzy": the distro name is not a
      reproducible pin, the dated sync stamp (20260616.084553) is. rclpy imports on
      Python 3.12.3 — this is the system-Jazzy half of the Isaac 3.11/3.12 split, and it
      must never be sourced into Isaac's interpreter.
  gazebo:
    version: Harmonic
    exact_version: gz-harmonic 1.0.0-1~noble   # installed + verified 2026-07-28
    gz_sim: gz-sim8 8.14.0-1~noble
    gz_tools: gz-tools2 2.0.3-2~noble
    status: observed
    installed_by: PX4 Tools/setup/ubuntu.sh (exit 0, 0 errors)
    note: >-
      Constrain transport to LOOPBACK — Gazebo multicast flooding the host network is a
      documented root cause of the Accel/Mag TIMEOUT failures (PX4/PX4-Autopilot#24595).
      Runs here set GZ_IP=127.0.0.1 and HEADLESS=1. The container's isolated netns helps
      but is not a substitute for the setting.
  nuttx_toolchain:
    arm_none_eabi_gcc: "20231009"
    status: observed
    note: >-
      Installed by the same setup script. Not needed for SITL, but required to flash real
      Pixhawk 6C firmware in Phase 4 — kept rather than skipped with --no-nuttx.
  micro_xrce_dds_agent:
    repo: https://github.com/eProsima/Micro-XRCE-DDS-Agent.git
    tag: v2.4.3          # DEVIATION from the plan's v2.4.2 — see deviation: below
    sha: 73622810d984349b80bbac0ef55fc0b694d62222   # built + smoke-tested 2026-07-28
    status: LOCKED
    build_flags: "-DUAGENT_USE_SYSTEM_FASTDDS=ON -DCMAKE_PREFIX_PATH=/opt/ros/jazzy"
    fastdds_actual: 2.14.6 (ros-jazzy-fastrtps) — matches what v2.4.3 targets
    smoke: "P0-07: 24 /fmu/out/* topics, 100.02 Hz, 300 s, 0 errors, agent alive at end"
    deviation: >-
      Upstream's superbuild pins Fast-DDS by BRANCH (CMakeLists.txt:99, `_fastdds_tag
      2.12.x`) and eProsima has since DELETED that branch, so a stock build of the pinned
      v2.4.2 tag fails: "fatal: invalid reference: 2.12.x". Live branches are now 2.6.x
      and 3.0.x-3.6.x; tags v2.12.0-v2.12.2 still exist.
      Fixed at the BUILD layer, not by editing the vendored source:
      -DUAGENT_USE_SYSTEM_FASTDDS=ON takes upstream's own system path, which sets
      `_fastdds_version 2` — i.e. upstream sanctions any 2.x. Side benefit: exactly one
      Fast-DDS on the machine, shared with the ROS 2 graph the agent talks to.
      This is why D2 exists — a pin expressed as a branch is not a pin.
  px4_ros_workspace:
    layout: >-
      Third-party ROS packages live in vendor/ (per .repos) and are built with
      `colcon build --base-paths ../vendor/px4_msgs ../vendor/px4_ros_com` from ros2_ws/,
      so no symlinks or copies land in ros2_ws/src and build/install/log stay git-ignored.
  px4_msgs:
    repo: https://github.com/PX4/px4_msgs.git
    branch: release/1.16
    sha: 392e831c1f659429ca83902e66820d7094591410   # cloned 2026-07-28
    msg_count: 226
    status: LOCKED   # /fmu/out/* observed populating with moving data (P0-07)
    smoke_result: >-
      24 /fmu/out/* topics present; /fmu/out/vehicle_local_position timestamps advanced
      1785275929412801 -> 1785275950356985 across a 20 s gap; rate 100.02 Hz, std dev
      0.002 s. The branch match is therefore proven by behaviour, not by the build.
    note: >-
      MUST be branch-matched to the firmware. A mismatch does not error — it silently
      breaks topics. A green colcon build does NOT close this; only observing populated
      /fmu/out/* topics does. CI asserts that, and the assertion is the only detector.
  px4_ros_com:
    repo: https://github.com/PX4/px4_ros_com.git
    branch: release/1.16
    sha: 86e9aeb20e55a4673fa8a9f1c29ea06a6c5ad1af   # cloned 2026-07-28
    status: pinned
    note: >-
      Example code only in the uXRCE-DDS era; not load-bearing. RESOLVED a TODO-verify:
      upstream does publish a release/1.16 branch, and it is used here. Note the
      development plan's setup snippet (02_development_plan.md:108) clones px4_ros_com
      with NO branch — i.e. main — while branch-matching px4_msgs. That asymmetry is a
      latent mismatch; both are branch-matched here.
  qgroundcontrol:
    distribution: AppImage
    version: 5.0.8            # released 2025-10-08; read from the embedded AppStream metainfo
    source_url: https://github.com/mavlink/qgroundcontrol/releases/download/v5.0.8/QGroundControl-x86_64.AppImage
    sha256: 06969c67ef58ea063def0a8271447a1cc385438c4a7df36813315b4475146737
    size_bytes: 180816376
    baked_into: drone-sim/qgc:v1.16.0            # downloaded + sha256-verified AT BUILD TIME
    path_in_image: /opt/qgc/squashfs-root        # extracted once at build, not per start
    downloaded: 2026-07-28
    repinned: 2026-07-30
    status: LOCKED
    enforced_by: >-
      docker/qgc.Dockerfile — the build downloads this exact URL, compares the sha256, and
      FAILS with both hashes on a mismatch. Verified by building with a deliberately wrong
      hash: exit 1, "checksum MISMATCH". Previously the pin was only enforced by a script
      the user had to remember to run.
    why_locked: >-
      QGC is a FUNCTIONAL DEPENDENCY OF FLIGHT, not an optional viewer. PX4 refuses to arm
      without a GCS datalink (NAV_DLL_ACT=2, set by the x500 airframe at
      4001_gz_x500:51); that check is deliberately left ENFORCED, and QGC is the only
      component permitted to speak MAVLink over IP — everything else is on the ROS graph.
      So the binary that holds the datalink determines whether the aircraft can arm.
    was: >-
      Previously pinned to the CloudFront *latest* channel with version TODO-verify. That
      is a moving target, not a pin — the same class of failure that made the XRCE agent's
      v2.4.2 retroactively unbuildable when its dependency branch was deleted. Repinned
      2026-07-30 to an exact release + sha256, verified byte-identical (`cmp` clean) to the
      AppImage used for the Phase 1 flight tests, so the pin reproduces what was tested
      rather than whatever is current.
    smoke: >-
      P0-08: connected to PX4 v1.16.0 SITL over UDP 14550 — "Ready To Fly", flight mode
      Hold, battery 100%, PX4 Autopilot detected, map at SITL default home
      (Irchelpark, Zurich 47.397N 8.545E). Screenshot evidence:
      docs/worklog/assets/2026-07-28-p0-08-qgc-connected.png
    headless_note: >-
      The container has no usable DISPLAY (an X0 socket exists but X authorization
      rejects us: "Authorization required, but no authorization protocol specified").
      QGC runs fine on a VIRTUAL display instead:
        Xvfb :99 -screen 0 1600x1000x24
        DISPLAY=:99 QT_QUICK_BACKEND=software LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb ./QGroundControl.AppImage
        DISPLAY=:99 import -window root shot.png
      Xvfb has no hardware GL, so QT_QUICK_BACKEND=software is REQUIRED for QtQuick.
      This same recipe is the general answer for verifying any GUI in this container
      (rviz, Foxglove) — capture a screenshot instead of claiming it works.
    note: chmod +x; add user to dialout; remove modemmanager (both only matter for real serial hardware).

# ---------------------------------------------------------------------------
