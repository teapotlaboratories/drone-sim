  cosys_airsim_ros2_wrapper:
    role: the C++ ROS 2 bridge publishing /airsim_node/<vehicle>/* sensor topics
    builds_against: >-
      upstream main/v3.4+ documents ROS 2 JAZZY on Ubuntu 24.04 — "The following was tested
      with ROS2 Jazzy" (docs/ros2.md, changed 2026-07-10 in commit d1ceeae1 from "tested on
      Ubuntu 22.04 with ROS2 Iron"), and install_linux.md: "The current recommended and
      tested environment is Ubuntu 24.04 LTS".
    status: LOCKED          # BUILT on Jazzy 2026-08-01 — C-06
    build_result: >-
      BUILDS. colcon build --symlink-install on ROS 2 Jazzy / Ubuntu 24.04 / g++ 13.3.0:
      exit 0 in 1 min 21 s, both packages (airsim_interfaces, airsim_ros_pkgs), 0 errors,
      warnings only (26 sign-compare, 20 class-memaccess, 2 attributes, 4 misc — all
      upstream's). No clang required: colcon builds AirLib itself via add_subdirectory, so
      the toolchain-ABI problem that made the UE5.5 line awkward does not arise.
      Artifacts asserted rather than assumed, per D-01: airsim_node is 12 MB, ldd reports
      0 unresolved libraries, it links /opt/ros/jazzy, and 24 airsim_interfaces message
      types register with `ros2 interface list`. The node starts, brings up its publishers
      and speaks the real AirSim RPC protocol.
      THE STAY-ON-JAZZY DECISION IS NOW EVIDENCE, NOT REASONING.
      Still unproven downstream: it has never run against an actual Cosys-AirSim server,
      which needs C-02's engine image.
    extra_apt_deps_needed: >-
      ros-jazzy-mavros-msgs and ros-jazzy-geographic-msgs were absent and had to be
      installed; pcl-conversions, tf2-sensor-msgs, image-transport, joy, cv-bridge,
      libyaml-cpp-dev, libopencv-dev and libpcl-dev were already present. Upstream's
      setup.sh additionally fetches rpclib 2.3.1 and eigen 3.4.1r — note BOTH come from
      WouterJansen/ forks rather than upstream rpclib/eigen, which is a supply-chain
      detail D-04's Dockerfile inherits.
    vindicates_jazzy_decision: >-
      STRONGLY, and it inverts 04's recommendation. Humble is now the RISKIER choice: main
      includes <cv_bridge/cv_bridge.hpp> and the Humble branch of vision_opencv ships only
      cv_bridge.h, so acting on 04's Humble advice against current upstream fails to compile
      immediately. Jazzy/24.04 is what upstream itself tests.
    but_verify_anyway: >-
      Upstream's only CI workflow (build-linux.yml) runs setup.sh, build.sh and a
      MavLinkTest --help smoke check — it NEVER invokes colcon and never builds ros2/.
      "Tested with ROS2 Jazzy" is a maintainer assertion with no automated signal behind it,
      and zero issues mention Jazzy, which plausibly means very few people have exercised
      the path. C-06 still runs first. Note also that upstream's own docker/build_ros2.sh
      hardcodes ROS_DISTRO=humble and tools/Dockerfile-ROS2 is FROM ros:foxy-ros-base —
      both stale. Do not copy them; write our own Jazzy/24.04 image.
    frames_WARNING: >-
      THE DOCS ARE WRONG ABOUT THIS. docs/ros2.md claims "the right-handed coordinate frame
      of the ROS standard and not in NED". The code negates only y and z, which is
      NED->NWU (and FRD->FLU) — NOT ENU. convert_tf_msg_to_enu() exists at
      airsim_ros_wrapper.cpp:1600 and is NEVER CALLED; every path calls
      convert_tf_msg_to_ros() instead. Anything written against REP-103 / px4_ros_com's ENU
      assumption will be YAW-ROTATED 90 DEGREES. Verify empirically against a known heading
      before trusting a single pose. This is precisely the silent-frame-error class
      lane-a/conventions.md exists to prevent.
    clock_trap: >-
      publish_clock publishes to "~/clock", which resolves to /airsim_node/clock on a node
      named airsim_node — NOT /clock — and it defaults to False in the launch file. Any
      use_sim_time consumer will silently block forever waiting for /clock. Lane A already
      paid for this exact failure shape in P1-03a: use_sim_time with no /clock publisher
      freezes every timer and looks like a deadlocked controller. Remap it.
    imu_trap: >-
      IMU is a POLLED SNAPSHOT, not a stream: publish_vehicle_state() calls getImuData()
      over RPC once per drone_state_timer tick (default 0.01 s) and publishes only the
      latest sample; intermediate samples are dropped and spacing is set by RPC/executor
      jitter. cuVSLAM and any preintegrating VIO expect a dense evenly-spaced stream.
      Measure the actual arrival distribution before trusting sim VIO (C-04 already
      requires this measurement — this is why).
    other_known_papercuts: >-
      camera_info header.frame_id is "<camera>_optical" while the image and static TF use
      "<vehicle>/<camera>_optical", so TF-aware perception (image_proc, depth_image_proc)
      cannot resolve it — trivial patch, but it bites on first integration. IMU messages
      ship with zero covariances ("// todo covariances").
  px4:
    tree: REUSE lane_a v1.16.0 — PROVISIONAL, verify in C-03
    transport: MAVLink Simulator API (TCP 4560), external-autopilot mode + lockstep
    status: TODO-verify
    note: >-
      If Cosys-AirSim works against v1.16.0, the project drops from TWO PX4 trees to ONE —
      collapsing the development plan's dominant architectural risk. Do not assume it:
      AirSim-lineage sims have historically broken across PX4 releases (the documented
      1.10-vs-1.11 breakage), and Project AirSim pins v1.12.3 verbatim. Lane B's v1.14.3
      pin is RETAINED below regardless, since it belongs to Pegasus, not to this lane.
    lockstep_settings: >-
      LockStep:true, UseTcp:true, SteppableClock, plus the PressureFactorSigma barometer
      tweak for fast GPS lock. Slow UE frames trigger PX4 SITL timeouts — this is the
      documented fragility, and it is the same failure class Lane A's RTF floor exists to
      catch. Assert an aggregate real-time metric here too; do NOT assert on an
      instantaneous field (see couplings.rtf-floor for why that was already wrong once).
    wire_protocol_unchanged_v1_12_to_v1_16: >-
      Verified 2026-07-31 against the PX4 v1.16.0 tree, which is why reusing v1.16.0 is
      plausible at all: the `none_iris` target still exists
      (src/modules/simulation/simulator_mavlink/CMakeLists.txt:62, "legacy compatibility
      launch helper", PX4_SYS_AUTOSTART=10016); PX4 still dials OUT as a TCP client to
      4560+instance while AirSim is the server (px4-rc.mavlinksim,
      SimulatorMavlink.cpp:1130); and lockstep is still on by default
      (boards/px4/sitl/sitl.cmake:14, ENABLE_LOCKSTEP_SCHEDULER yes).
    THREE_DEFECTS_TO_EXPECT: >-
      Found by research 2026-07-31. None is a blocker; all three cost time if hit blind.
      (1) PX4Scripts/run_airsim_sitl.sh exports PX4_SIM_MODEL=iris, which PX4 has rejected
          since the v1.14 airframe rename to 10016_none_iris — rcS exits 1 with "Unknown
          model". Upstream's multi-vehicle docs also reference Tools/sitl_multiple_run.sh,
          which 404s at v1.16.0. Lane C will need its own launch scripts, which suits the
          bringup package we already have.
      (2) LOCKSTEP MAY BE DEAD CODE. initialize() sets lock_step_enabled_
          (MavLinkMultirotorApi.hpp:66) and then openAllConnections() -> resetState()
          clears it back to false. If so, every "LockStep: true" setup actually runs
          free-running — precisely the mode that degrades under LiDAR + multi-camera + VLM
          load, i.e. our target workload. VERIFY THIS EMPIRICALLY before trusting any
          timing result; the fix is a small patch, the danger is not knowing.
      (3) The "disabling lockstep" docs point at boards/px4/sitl/default.cmake, which 404s
          in v1.16.0 — it is sitl.cmake now.
    known_defect_upstream: >-
      Cosys-Lab/Cosys-AirSim#129 reports lockstep desync against PX4 v1.16.0 with ~1.2 s
      stale timestamps causing PX4 to REJECT /fmu/in/obstacle_distance as too old. That is
      a direct Phase 2 concern: obstacle avoidance writes exactly that topic. Any graph
      mixing /airsim_node/* and /fmu/* needs an explicit time-alignment design, not an
      assumption that both are on the same clock.
    px4_upstream_support_posture: >-
      PX4 classifies AirSim as COMMUNITY-SUPPORTED and explicitly disclaims that it "may or
      may not work with current versions of PX4". No upstream regression test protects this
      integration; a future PX4 point release can break it silently. This is an argument
      for pinning an exact PX4 tag — which we already do — and for keeping Lane A, which
      does have first-class PX4 support, as the baseline.
    uxrce_dds_parity: >-
      REQUIRED, and it is the entire sim-to-real claim: PX4 SITL must ALSO run
      uxrce_dds_client so the ROS 2 graph sees the SAME /fmu/out/* topics the real
      Pixhawk 6C produces. MAVLink drives the sim physics handshake; XRCE-DDS drives the
      autonomy code. Acceptance for C-03 is identical topic names to Lane A with only the
      transport swapped — verify by diffing `ros2 topic list` against a Lane A run.
    parity_scope_clarified_2026_07_31: >-
      A repo-wide grep of Cosys-AirSim finds ZERO references to uxrce / micro-XRCE /
      px4_msgs / /fmu/out — all 54 PX4 hits are MAVLink/MavLinkCom with lockstep and
      SteppableClock. THAT IS EXPECTED AND IS NOT A REFUTATION: /fmu/out/* is produced by
      PX4's OWN uxrce_dds_client, which needs no knowledge of the simulator driving it over
      MAVLink. What the grep does establish is the correct DIVISION:
        - FLIGHT state / commands -> PX4 -> /fmu/out/*, /fmu/in/*  (parity expected here)
        - SENSOR imagery / LiDAR  -> Cosys-AirSim -> /airsim_node/<vehicle>/* with
          airsim_interfaces/* custom types  (NO Lane A equivalent — this is new surface)
      EMPIRICALLY CONFIRMED, not just architectural: PX4's SITL rcS starts
      uxrce_dds_client UNCONDITIONALLY regardless of which simulator drives it (true in
      v1.14.3, v1.15.4 and v1.16.0 alike), and Cosys-Lab/Cosys-AirSim#129 shows a third
      party reading /fmu/out/sensor_combined and writing /fmu/in/obstacle_distance while
      AirSim drives PX4 v1.16.0. So the /fmu/* half of the parity claim is real. What that
      issue ALSO shows is the clock caveat recorded under known_defect_upstream.
      So "only the transport is swapped" holds for the CONTROLLER and must be proved in
      C-03; it was never true of the perception topics, which Lane A does not have at all.
      One real sim-to-real gap to record now: AirSim's odom_local is
      kinematics_estimated — the physics engine's GROUND TRUTH, not PX4's EKF2 output.
      Tuning or training against noiseless odometry is a gap that will not surface until
      real flight. Prefer /fmu/out/vehicle_odometry over /airsim_node/*/odom_local wherever
      both exist.
  cesium_for_unreal:
    role: georeferenced real-world terrain for Phase 4 benchmark environments
    version: v2.28.0                 # released 2026-07-01; current releases/latest
    supports_ue: [5.5, 5.6, 5.7, 5.8]
    status: pinned
    ue58_support: >-
      CONFIRMED 2026-07-31 on artifact evidence, not a roadmap statement. CHANGES.md for
      v2.28.0: "Added support for Unreal Engine 5.8." PR CesiumGS/cesium-unreal#1856
      "Support for Unreal 5.8" merged 2026-06-26. The release body names v5.5, v5.6, v5.7
      and v5.8 for Windows/Linux/macOS/Android/iOS, and the UE5.8 asset is a real 1.23 GB
      download returning HTTP 200. Cesium's historical lag behind an Unreal release is
      5-27 days; for 5.8 it was 14.
    THE_FALLBACK_HAS_INVERTED: >-
      IMPORTANT — this reverses the trade recorded in docs/lane-c/todo.md when the UE5.8
      decision was taken. Cesium v2.29.0 states "Removed support for Unreal Engine 5.5.
      Unreal Engine 5.6 or later is now required", and the README already lists v2.28.0 as
      the TERMINAL release for UE5.5. So falling back to UE5.5 would now mean: an
      end-of-line Cosys-AirSim branch, PLUS a header patch we own forever, PLUS a Cesium
      frozen at v2.28.0 permanently. UE5.8 is the only forward-supported path. UE5.5 is no
      longer a safe fallback and should not be described as one.
    asset_naming_trap: >-
      The download URL PRINTED IN THE v2.28.0 RELEASE NOTES — CesiumForUnreal-58-v2.28.0.zip
      — returns HTTP 404. Every asset in that release is actually named "-main.zip", i.e.
      CesiumForUnreal-58-main.zip. Any fetch script written from the release notes will fail;
      write it from the API asset list. This is the same class as the QGC `latest`-channel
      pin: take the artifact you verified, not the string the docs printed.
    note: >-
      CORRECTED 2026-07-31: the FSD-vs-PhysX exclusion recorded here previously is
      OMNIVERSE-SPECIFIC (Cesium for Omniverse + Isaac's Fabric Scene Delegate) and does
      NOT automatically apply to Cesium for UNREAL, which is a different plugin. It is
      retained under lane_b where it belongs. Whether UE5 gives georeferenced terrain WITH
      physics is an open Lane C question — verify, do not inherit the Omniverse answer.
    known_pitfalls: >-
      (1) Google Photorealistic 3D Tiles render black/unloaded at drone altitude
      (10-500 ft AGL) — documented in both the Unreal and Omniverse plugins. Fallback for
      low-altitude AOIs is OSM/StreetMap + UE5 PCG, or photogrammetry meshes.
      (2) Coordinate reconciliation is a known silent-error source: AirSim NED origin vs
      CesiumGeoreference vs UE centimetres. Set PX4 LPE_LAT/LPE_LON and AirSim
      OriginGeopoint to the same lat/lon or the vehicle is offset/rotated.
      (3) Google 3D Tiles need a Cesium ion token and fall under Google Maps Platform terms.

# ---------------------------------------------------------------------------
# Perception / planning / VLM upstreams  (Phase 2-4)
# ---------------------------------------------------------------------------
components:
  isaac_ros_visual_slam:
    role: VIO (cuVSLAM)
    ros_distro: jazzy
    version: TODO-verify
    status: TODO-verify
    note: Designed and tested for ROS 2 Jazzy on Jetson and x86_64 with an NVIDIA GPU.
  isaac_ros_nvblox:
    role: GPU mapping -> Nav2 costmap + 3D reconstruction
    version: TODO-verify
    status: TODO-verify
    cpu_fallback: OctoMap
    note: GPU-only; CI gates this path on a self-hosted GPU runner with OctoMap fallback.
  ego_planner:
    repo: EGO-Swarm (ROS 2 branch), drone_id=0
    sha: TODO-verify
    status: TODO-verify
    note: >-
      Canonical ZJU-FAST-Lab/ego-planner is ROS 1 / catkin / Ubuntu <=20.04. ROS 2 support
      lives in the EGO-Swarm repo. A PX4-integrated fork exists (hyq123-cmd/px4_ego_planner).
      This port MUST ship a code-map doc with grepped file:line citations in both trees.
      Params from Fly0: 50 Hz control, ~0.5 Hz re-grounding, d_safe=0.5 m, v_max=4.0 m/s.
  vllm:
    role: dev-time VLM serving on GPU 1
    version: 0.26.0                 # installed + imported 2026-07-28
    torch: 2.11.0+cu130
    cuda: "13.0"
    torch_arch_list: [sm_75, sm_80, sm_86, sm_90, sm_100, sm_120]
    blackwell_ok: true              # sm_120 present — no cu128-nightly workaround needed
    venv: /var/mnt/<uuid>/Developments/projects/drone-sim/venvs/vllm
    status: observed                # NOT locked — no model served yet, no hello-VLM call
    model: Qwen3-VL-8B-AWQ    # 16 GB card confirmed; 4B also viable
    CRITICAL_env: "CUDA_DEVICE_ORDER=PCI_BUS_ID"
    critical_note: >-
      vLLM emits this on every import here: "Detected different devices in the system:
      NVIDIA GeForce RTX 3080, NVIDIA GeForce RTX 5060 Ti. Please make sure to set
      CUDA_DEVICE_ORDER=PCI_BUS_ID to avoid unexpected behavior."
      This matters more on this box than on a uniform one. CUDA's DEFAULT ordering is
      FASTEST_FIRST, not PCI bus order — so with two DISSIMILAR cards,
      CUDA_VISIBLE_DEVICES=1 is NOT guaranteed to select the 5060 Ti. The GPU work split
      (render on 0 / infer on 1) is a hard project rule, and enforcing it with
      CUDA_VISIBLE_DEVICES alone is unsafe without ALSO pinning
      CUDA_DEVICE_ORDER=PCI_BUS_ID. Every vLLM launch must set both, and any run must be
      confirmed against nvidia-smi rather than assumed.
    note: >-
      Use --quantization awq ("int4" is not a valid vLLM quantization value). Cap
      max_pixels — VL KV cache is heavy. Qwen3-VL-30B-A3B does NOT fit (~17 GB at INT4
      before vision tower + KV).
  onboard_serving:
    platform: Jetson Orin NX 16 GB
    stack: jetson-containers + TensorRT-LLM, AWQ LLM + FP16 ViT, KV-cache reuse, CUDA graphs
    model: Qwen3-VL-4B-AWQ
    status: pinned
    note: >-
      NEVER Ollama onboard — Qwen3-VL 2B/4B loads entirely onto the CPU with zero GPU
      offload on Jetson Orin / JetPack 6.2.1 (ollama/ollama#13247), while qwen2.5-vl:3b
      offloads correctly. Onboard decision latency budget: <= 1 s.

