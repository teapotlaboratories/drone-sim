#
# *** DEFERRED 2026-07-29 *** Isaac Sim 5.1 SIGSEGVs on this host's driver 610.43.03
# (validated: 580.65.06), reproduced on the AMPERE card with Blackwell excluded — so it
# is the driver, not the GPU. Isaac 6.0 avoids the crash but NO Pegasus release exists for
